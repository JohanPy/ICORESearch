<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICORESearch - Conference Dashboard</title>
    <meta name="description" content="Dashboard for filtering and exploring computer science conferences based on CORE rankings.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="script.js?v=1.3" defer></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>ICORESearch Dashboard</h1>
            <p>Filter, explore, and export conference data seamlessly.</p>
        </header>

        <section class="filters-section glass-panel">
            <div class="filter-group relative">
                <label>Themes / Topics</label>
                <div class="custom-select" id="theme-select-btn">
                    <span class="placeholder" id="theme-select-label">All Themes</span>
                    <svg class="chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="dropdown-menu hidden" id="theme-dropdown-menu">
                    <div class="dropdown-search">
                        <input type="text" id="theme-search" placeholder="Search themes...">
                    </div>
                    <div class="tree-container" id="theme-tree">
                        <div style="padding: 10px; text-align: center; color: var(--text-muted);">Loading themes...</div>
                    </div>
                </div>
            </div>
            <div class="filter-group relative">
                <label>Ranks</label>
                <div class="custom-select" id="rank-select-btn">
                    <span class="placeholder" id="rank-select-label">All Ranks</span>
                    <svg class="chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="dropdown-menu hidden" id="rank-dropdown-menu">
                    <div class="rank-options">
                        <label class="checkbox-container">
                            <input type="checkbox" value="A*" class="rank-checkbox" checked>
                            <span>A*</span>
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" value="A" class="rank-checkbox" checked>
                            <span>A</span>
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" value="B" class="rank-checkbox" checked>
                            <span>B</span>
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" value="C" class="rank-checkbox" checked>
                            <span>C</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="filter-group relative">
                <label>Year</label>
                <div class="custom-select" id="year-select-btn">
                    <span class="placeholder" id="year-select-label">All Years</span>
                    <svg class="chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="dropdown-menu hidden" id="year-dropdown-menu">
                    <div class="rank-options" id="year-options">
                        <!-- Dynamic checkboxes injected here -->
                    </div>
                </div>
            </div>
            <div class="filter-group relative">
                <label>Status</label>
                <div class="custom-select" id="status-select-btn">
                    <span class="placeholder" id="status-select-label">All Statuses</span>
                    <svg class="chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="dropdown-menu hidden" id="status-dropdown-menu">
                    <div class="rank-options">
                        <label class="checkbox-container">
                            <input type="checkbox" value="found" class="status-checkbox" checked>
                            <span>Found (Success)</span>
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" value="notfound" class="status-checkbox" checked>
                            <span>Not Found / Failed</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="filter-group">
                <label for="date-depot-filter">Submission (On/After)</label>
                <input type="date" id="date-depot-filter">
            </div>
            <div class="filter-group">
                <label for="date-reponse-filter">Notification (On/Before)</label>
                <input type="date" id="date-reponse-filter">
            </div>
            <div class="filter-actions">
                <button id="reset-btn" class="btn btn-secondary">Reset</button>
                <button id="export-btn" class="btn btn-primary">
                    <svg style="width: 16px; height: 16px; margin-right: 6px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV
                </button>
            </div>
        </section>

        <section class="results-section">
            <div class="table-container glass-panel">
                <table id="conferences-table">
                    <thead>
                        <tr>
                            <th data-sort="Acronym">Acronym</th>
                            <th data-sort="Year">Year</th>
                            <th data-sort="Name">Name</th>
                            <th data-sort="Rank">Rank</th>
                            <th data-sort="Submission Deadline">Submission</th>
                            <th data-sort="Notification Date">Notification</th>
                            <th data-sort="Topics">Topics</th>
                            <th data-sort="Status">Status</th>
                            <th data-sort="URL">Link</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
